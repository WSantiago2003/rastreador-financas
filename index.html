<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard & Rastreador de Finanças</title>
    <link rel="stylesheet" href="style.css">
    <!-- Importação do Chart.js para os gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1>💡 Painel de Finanças Pessoais</h1>
        </header>

        <!-- Cards de Resumo Financeiro -->
        <section class="cards-grid">
            <div class="card receita">
                <h3>Entradas</h3>
                <p id="totalReceitas">R$ 0,00</p>
            </div>
            <div class="card despesa">
                <h3>Saídas</h3>
                <p id="totalDespesas">R$ 0,00</p>
            </div>
            <div class="card saldo">
                <h3>Saldo Atual</h3>
                <p id="saldoTotal">R$ 0,00</p>
            </div>
        </section>

        <!-- Seção Principal: Formulário + Gráfico -->
        <section class="main-grid">
            <!-- Formulário -->
            <div class="card-form">
                <h2>Nova Transação</h2>
                <form id="formTransacao" onsubmit="salvarTransacao(event)">
                    <div class="input-group">
                        <label>Descrição</label>
                        <input type="text" id="descricao" placeholder="Ex: Salário, Mercado..." required>
                    </div>

                    <div class="input-group-row">
                        <div>
                            <label>Valor (R$)</label>
                            <input type="number" step="0.01" id="valor" placeholder="0.00" required>
                        </div>
                        <div>
                            <label>Tipo</label>
                            <select id="tipo" required>
                                <option value="receita">Receita (+)</option>
                                <option value="despesa">Despesa (-)</option>
                            </select>
                        </div>
                    </div>

                    <div class="input-group-row">
                        <div>
                            <label>Categoria</label>
                            <select id="categoria" required>
                                <option value="Alimentação">🍕 Alimentação</option>
                                <option value="Moradia">🏠 Moradia</option>
                                <option value="Transporte">🚗 Transporte</option>
                                <option value="Lazer">🎉 Lazer</option>
                                <option value="Renda">💰 Renda / Salário</option>
                                <option value="Outros">📦 Outros</option>
                            </select>
                        </div>
                        <div>
                            <label>Data</label>
                            <input type="date" id="data" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-adicionar">+ Adicionar Registro</button>
                </form>
            </div>

            <!-- Gráfico de Categoria de Despesas -->
            <div class="card-chart">
                <h2>Despesas por Categoria</h2>
                <div class="chart-wrapper">
                    <canvas id="graficoCategorias"></canvas>
                </div>
            </div>
        </section>

        <!-- Tabela de Histórico -->
        <section class="historico-section">
            <div class="historico-header">
                <h2>Histórico de Transações</h2>
                
                <div class="filtros-container">
                    <select id="filtroMes" onchange="aplicarFiltros()">
                        <option value="">Todos os Meses</option>
                        <option value="1">Janeiro</option>
                        <option value="2">Fevereiro</option>
                        <option value="3">Março</option>
                        <option value="4">Abril</option>
                        <option value="5">Maio</option>
                        <option value="6">Junho</option>
                        <option value="7">Julho</option>
                        <option value="8">Agosto</option>
                        <option value="9">Setembro</option>
                        <option value="10">Outubro</option>
                        <option value="11">Novembro</option>
                        <option value="12">Dezembro</option>
                    </select>

                    <select id="filtroAno" onchange="aplicarFiltros()">
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                    </select>

                    <button class="btn-exportar" onclick="exportarCSV()">📥 Exportar CSV</button>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Descrição</th>
                            <th>Categoria</th>
                            <th>Tipo</th>
                            <th>Valor</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaTransacoes">
                        <!-- Transações serão carregadas via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
